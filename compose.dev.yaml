services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_password}
      DB_NAME: ${DB_NAME:-app}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-shadow-db.sh:/docker-entrypoint-initdb.d/01-init-shadow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: mysql://${DB_USER:-app}:${DB_PASSWORD:-app_dev_password}@mysql:3306/${DB_NAME:-app}
      DATABASE_SSL: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
