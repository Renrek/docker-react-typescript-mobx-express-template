services:
  app:
    build: .
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your network-hosted MySQL database}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: ${DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL:-false}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
